[package]
name = "osmiridium-network"
description = "Secure network communication layer for MPC parties"
version = { workspace = true }
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-rustls = "0.26"
ed25519-dalek = "2"
zeroize = "1.7"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.0"
rand = "0.8"
rand_chacha = "0.9"
sha2 = "0.10"
hkdf = "0.12"
blake3 = "1.5"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "1.0"
async-trait = "0.1"
rcgen = "0.13"
base64 = "0.22"
