[package]
name = "osmiridium-network"
description = "Secure network communication layer for MPC parties"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
futures-util = "0.3"
quinn = "0.11"
rustls = "0.23"
rustls-pemfile = "2.0"
x509-parser = "0.16"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
hkdf = "0.12"
blake3 = "1.5"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "1.0"
async-trait = "0.1"
rcgen = "0.13"
base64 = "0.22"
