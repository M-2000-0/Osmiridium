[package]
name = "osmiridium-protocol"
description = "SPDZ-family MPC protocol implementation"
version = { workspace = true }
edition = "2021"

[dependencies]
osmiridium-crypto = { path = "../crypto" }
osmiridium-network = { path = "../network" }
ark-ff = "0.5"
ark-std = "0.5"
ark-poly = "0.6"
rand = "0.8"
rand_chacha = "0.9"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"

[dev-dependencies]
futures-util = "0.3"
proptest = "1.0"
