[package]
name = "osmiridium-api"
description = "gRPC and REST API for the Osmiridium platform"
version = { workspace = true }
edition = "2021"

[dependencies]
osmiridium-coordinator = { path = "../coordinator" }
osmiridium-protocol = { path = "../protocol" }
osmiridium-network = { path = "../network" }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["limit", "trace", "fs"] }
http = "1.0"
http-body-util = "0.1"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "2.0"
chrono = "0.4"
bincode = "1.3"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio-stream = "0.1"
