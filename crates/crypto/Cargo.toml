[package]
name = "osmiridium-crypto"
description = "Core cryptographic primitives for the Osmiridium SMPC platform"
edition = "2021"
version = { workspace = true }

[dependencies]
ark-ff = { version = "0.5", features = ["asm", "parallel"] }
ark-bn254 = "0.5"
ark-poly = "0.5"
ark-serialize = { version = "0.5", features = ["derive"] }
ark-std = { version = "0.5", features = ["std", "parallel"] }
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
blake3 = "1.5"
digest = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
subtle = "2.5"

[dev-dependencies]
proptest = "1.0"
