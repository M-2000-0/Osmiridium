[package]
name = "osmiridium-coordinator"
description = "Collaboration layer coordinator and policy engine"
version = { workspace = true }
edition = "2021"

[dependencies]
osmiridium-crypto = { path = "../crypto" }
osmiridium-protocol = { path = "../protocol" }
osmiridium-network = { path = "../network" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1.0"
blake3 = "1.5"
