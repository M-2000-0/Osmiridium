[package]
name = "osmiridium-testing"
description = "Testing utilities and framework for Osmiridium SMPC"
publish = false
edition = "2021"

[dependencies]
osmiridium-crypto = { path = "../crypto" }
osmiridium-protocol = { path = "../protocol" }
osmiridium-network = { path = "../network" }
osmiridium-coordinator = { path = "../coordinator" }
osmiridium-fhe = { path = "../fhe" }
osmiridium-api = { path = "../api" }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
tracing = "0.1"
chrono = "0.4"
bincode = "1.3"

[dev-dependencies]
tower = "0.5"
tower-http = "0.5"
axum = "0.7"
http = "1.0"
http-body-util = "0.1"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-health = "0.12"
criterion = { workspace = true }
