[package]
name = "osmiridium-cli"
description = "Command-line interface for Osmiridium SMPC"
edition = "2021"

[dependencies]
osmiridium-coordinator = { path = "../coordinator" }
osmiridium-protocol = { path = "../protocol" }
osmiridium-network = { path = "../network" }
osmiridium-crypto = { path = "../crypto" }
osmiridium-api = { path = "../api" }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
