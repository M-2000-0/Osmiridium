apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osmiridium-netpol
  namespace: osmiridium
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
        - port: 50051
        - port: 9000
  egress:
    - to:
        - podSelector: {}
      ports:
        - port: 8080
        - port: 50051
        - port: 9000
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
