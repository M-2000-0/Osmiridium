apiVersion: v1
kind: ConfigMap
metadata:
  name: osmiridium-config
  namespace: osmiridium
data:
  RUST_LOG: "osmiridium=info,tower_http=warn"
  OSMOSMPC_LISTEN_ADDR: "0.0.0.0"
  OSMOSMPC_LISTEN_PORT: "8080"
  OSMOSMPC_GRPC_PORT: "50051"
  OSMOSMPC_NUM_PARTIES: "3"
  OSMOSMPC_SECURITY_BITS: "128"
  OSMOSMPC_TLS_ENABLED: "false"
  OSMOSMPC_RATE_LIMIT: "60"
  OSMOSMPC_MAX_MESSAGE_SIZE: "1048576"
  OSMOSMPC_DATA_DIR: "/app/data"
