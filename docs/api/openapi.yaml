openapi: 3.0.3
info:
  title: Osmiridium Coordinator API
  description: |
    REST interface for session management and secure multi-party computation.

    Protected endpoints require an API key sent either as the `x-api-key`
    header or as a Bearer token in `Authorization`. Override the server-side
    key with the `OSMOSMPC_API_KEY` environment variable.
  version: 0.1.0-alpha
servers:
  - url: http://localhost:8080
    description: Local development (osmiridium verify)
tags:
  - name: ops
    description: Health and metrics
  - name: sessions
    description: Computation session lifecycle

paths:
  /health:
    get:
      tags: [ops]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is up
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /metrics:
    get:
      tags: [ops]
      summary: Prometheus metrics
      security: []
      description: |
        Counter exposition in Prometheus text format (version 0.0.4).
        Exposed without auth by design; restrict at the network layer.
      responses:
        '200':
          description: Metrics snapshot
          content:
            text/plain; version=0.0.4:
              schema:
                type: string

  /sessions:
    post:
      tags: [sessions]
      summary: Create a computation session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /sessions/{id}:
    get:
      tags: [sessions]
      summary: Get session status
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '400':
          description: Session id is not a UUID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown session id

  /sessions/{id}/participants:
    post:
      tags: [sessions]
      summary: Add a participant to a session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipantRequest'
      responses:
        '200':
          description: Participant registered
        '400':
          description: Bad UUID, malformed body, or unknown role
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Policy denied registration
        '404':
          description: Unknown session id

  /sessions/{id}/execute:
    post:
      tags: [sessions]
      summary: Execute the session's circuit
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Execution finished; hex-encoded output values per wire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Results'
        '400':
          description: Session id is not a UUID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Protocol failure during execution

  /sessions/{id}/results:
    get:
      tags: [sessions]
      summary: Fetch stored results for a session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Results (possibly empty if not executed yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Results'
        '400':
          description: Session id is not a UUID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown session id

components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Session UUID
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid API key
    RateLimited:
      description: Per-IP request quota exceeded (OSMOSMPC_RATE_LIMIT/min)
    Internal:
      description: Unexpected coordinator failure

  schemas:
    CreateSessionRequest:
      type: object
      required: [name, num_parties]
      properties:
        name:
          type: string
          minLength: 1
        num_parties:
          type: integer
          minimum: 1

    SessionInfo:
      type: object
      required: [id, name, status, num_participants]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          description: Debug-formatted SessionStatus variant (e.g. "Created")
        num_participants:
          type: integer

    AddParticipantRequest:
      type: object
      required: [party_id, name, endpoint, role]
      properties:
        party_id:
          type: integer
          minimum: 0
        name:
          type: string
        endpoint:
          type: string
          description: host:port reachability hint for this party
        role:
          type: string
          enum: [DataProvider, ComputationRunner, Auditor, Administrator]

    Results:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: string
          description: Hex-encoded field element outputs, one per output wire

  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer

security:
  - ApiKeyHeader: []
  - BearerAuth: []
