openapi: "3.0.3"
info:
  title: Osmiridium SMPC API
  description: |
    REST API for the Osmiridium secure multi-party computation platform.
    Manages sessions, participants, and computation execution.
  version: "0.1.0-alpha"
  license:
    name: BUSL-1.1
    url: https://github.com/osmiridium/osmiridium/blob/main/LICENSE

servers:
  - url: http://localhost:9000
    description: Local development server

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      summary: Health check
      description: Returns server health status and version.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: "0.1.0-alpha"

  /metrics:
    get:
      summary: Prometheus metrics
      description: Returns metrics in Prometheus text format.
      tags: [Metrics]
      security: []
      responses:
        "200":
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string

  /sessions:
    get:
      summary: List sessions
      description: Returns all sessions.
      tags: [Sessions]
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"
    post:
      summary: Create session
      description: Creates a new computation session.
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{id}:
    get:
      summary: Get session
      description: Returns session details.
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/participants:
    post:
      summary: Add participant
      description: Adds a participant to a session.
      tags: [Participants]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddParticipantRequest"
      responses:
        "200":
          description: Participant added
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /sessions/{id}/execute:
    post:
      summary: Execute session
      description: Executes the computation for a session.
      tags: [Execution]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Execution completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /sessions/{id}/results:
    get:
      summary: Get results
      description: Returns execution results for a completed session.
      tags: [Execution]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Execution results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/cancel:
    post:
      summary: Cancel session
      description: Cancels a pending or configured session.
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session cancelled
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for authentication

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Session UUID

  schemas:
    SessionInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [Created, Configured, Running, Completed, Failed, Cancelled]
        num_participants:
          type: integer

    CreateSessionRequest:
      type: object
      required: [name, num_parties]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        num_parties:
          type: integer
          minimum: 2
          maximum: 64

    AddParticipantRequest:
      type: object
      required: [party_id, name, endpoint, role]
      properties:
        party_id:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 128
        endpoint:
          type: string
          description: "host:port format"
          maxLength: 256
        role:
          type: string
          enum: [DataProvider, ComputationRunner, Auditor, Administrator]

    ExecuteResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: string
          description: Hex-encoded output values

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: integer
        message:
          type: string
        details:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
