services:
  coord:
    build: .
    image: ghcr.io/${IMAGE_NAMESPACE:-M-2000-0/Osmiridium}:latest
    container_name: osmiridium-coord
    command: ["verify", "--addr", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      OSMOSMPC_API_KEY: "${OSMOSMPC_API_KEY:-changeme}"
      OSMOSMPC_RATE_LIMIT: "${OSMOSMPC_RATE_LIMIT:-60}"
      RUST_LOG: "${RUST_LOG:-osmiridium=info}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - osmiridium-net

  party-0:
    build: .
    image: ghcr.io/${IMAGE_NAMESPACE:-M-2000-0/Osmiridium}:latest
    container_name: osmiridium-party-0
    command: ["execute", "--session", "party-0"]
    restart: "no"
    depends_on:
      coord:
        condition: service_healthy
    environment:
      OSMOSMPC_PARTY_ID: "0"
      OSMOSMPC_LISTEN_PORT: "9000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - osmiridium-net

  party-1:
    build: .
    image: ghcr.io/${IMAGE_NAMESPACE:-M-2000-0/Osmiridium}:latest
    container_name: osmiridium-party-1
    command: ["execute", "--session", "party-1"]
    restart: "no"
    depends_on:
      coord:
        condition: service_healthy
    environment:
      OSMOSMPC_PARTY_ID: "1"
      OSMOSMPC_LISTEN_PORT: "9001"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - osmiridium-net

  party-2:
    build: .
    image: ghcr.io/${IMAGE_NAMESPACE:-M-2000-0/Osmiridium}:latest
    container_name: osmiridium-party-2
    command: ["execute", "--session", "party-2"]
    restart: "no"
    depends_on:
      coord:
        condition: service_healthy
    environment:
      OSMOSMPC_PARTY_ID: "2"
      OSMOSMPC_LISTEN_PORT: "9002"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - osmiridium-net

prometheus:
    image: prom/prometheus:v2.54.1
    container_name: osmiridium-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      coord:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - osmiridium-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: osmiridium-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - osmiridium-net

networks:
  osmiridium-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: