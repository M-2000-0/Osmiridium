[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/protocol",
    "crates/network",
    "crates/coordinator",
    "crates/api",
    "crates/cli",
    "crates/fhe",
    "crates/testing",
]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
rust-version = "1.97"
license = "BUSL-1.1"
repository = "https://github.com/M-2000-0/Osmiridium"
homepage = "https://osmiridium.tech"
documentation = "https://docs.osmiridium.tech"

[workspace.dependencies]
# Crypto
ark-ff = { version = "0.5", features = ["asm"] }
ark-poly = "0.6"
ark-std = { version = "0.5", features = ["std"] }
ark-serialize = { version = "0.5", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
hkdf = "0.12"
blake3 = "1.5"
digest = "0.10"
subtle = "2.5"
zeroize = { version = "1.7", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Networking
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
rustls = "0.23"

# API
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
axum = "0.7"
tower = "0.5"
tower-http = "0.5"
http = "1.0"
http-body-util = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
cfg-if = "1.0"

# Testing
proptest = "1.0"
criterion = { version = "0.5", features = ["async_tokio"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1
