name: Benchmarks

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run CLI benchmark
        run: cargo run -p osmiridium-cli -- bench --size 100 --repeats 1000

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output
          path: |
            target/debug/osmiridium-cli
          retention-days: 7